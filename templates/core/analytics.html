{% extends "base/base.html" %}
{% block title %}Analytics Dashboard{% endblock %}
{% block content %}
<div style="padding:2rem; font-family:system-ui,sans-serif;">
  <h1 style="font-size:1.5rem; font-weight:600; margin-bottom:0.25rem;">Analytics Dashboard</h1>
  <p style="color:#666; margin-bottom:2rem; font-size:0.9rem;">
    Application Insights · Web Analytics · Last 24 hours
  </p>

  <div id="pageviews-section"
       hx-get="{% url 'core:analytics_pageviews' %}"
       hx-trigger="load" hx-swap="innerHTML">
    <div style="text-align:center; padding:2rem; color:#999;">⏳ Loading page views...</div>
  </div>

  <div style="display:grid; grid-template-columns:1fr 1fr; gap:1.5rem; margin-top:1.5rem;">
    <div id="browsers-section"
         hx-get="{% url 'core:analytics_browsers' %}"
         hx-trigger="load" hx-swap="innerHTML">
      <div style="background:#fff; border:1px solid #e0e0e0; border-radius:8px;
                  padding:1.25rem; text-align:center; color:#999;">⏳ Loading browsers...</div>
    </div>
    <div id="performance-section"
         hx-get="{% url 'core:analytics_performance' %}"
         hx-trigger="load" hx-swap="innerHTML">
      <div style="background:#fff; border:1px solid #e0e0e0; border-radius:8px;
                  padding:1.25rem; text-align:center; color:#999;">⏳ Loading performance...</div>
    </div>
  </div>

  <div id="rum-section"
       hx-get="{% url 'core:analytics_rum' %}"
       hx-trigger="load" hx-swap="innerHTML"
       style="margin-top:1.5rem;">
    <div style="background:#fff;border:1px solid #e0e0e0;border-radius:8px;
                padding:1.25rem;text-align:center;color:#999;">
      ⏳ Loading RUM metrics...
    </div>
  </div>
</div>
{% endblock %}
