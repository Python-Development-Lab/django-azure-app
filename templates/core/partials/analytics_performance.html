{% if error %}
<div style="background:#fff3cd; border:1px solid #ffc107; border-radius:6px;
            padding:0.75rem; font-size:0.85rem; color:#856404;">⚠ {{ error }}</div>
{% else %}
<div style="background:#fff; border:1px solid #e0e0e0; border-radius:8px; padding:1.25rem;">
  <h2 style="font-size:1rem; font-weight:600; margin-bottom:1rem;">Hourly Traffic — Last 24h</h2>
  <div style="position:relative; height:200px;"><canvas id="trafficChart"></canvas></div>
</div>
<script>
(function() {
  var trend = {{ trend_json|safe }};
  if (trend.length > 0) {
    new Chart(document.getElementById('trafficChart'), {
      type: 'bar',
      data: {
        labels: trend.map(function(t){return t.hour.substring(11,16);}),
        datasets: [
          {label:'Views', data: trend.map(function(t){return t.views;}),
           backgroundColor:'rgba(0,120,212,0.7)', borderRadius:3, yAxisID:'y'},
          {label:'Avg ms', data: trend.map(function(t){return t.avg_ms;}),
           type:'line', borderColor:'#e65100', backgroundColor:'transparent',
           borderWidth:2, pointRadius:3, yAxisID:'y1'}
        ]
      },
      options: {
        responsive:true, maintainAspectRatio:false,
        plugins:{legend:{position:'top',labels:{font:{size:10},boxWidth:10}}},
        scales:{
          x:{ticks:{color:'#666',font:{size:10}},grid:{display:false}},
          y:{ticks:{color:'#0078d4',font:{size:10}},grid:{color:'#f0f0f0'},
             title:{display:true,text:'Views',color:'#0078d4',font:{size:10}}},
          y1:{position:'right',ticks:{color:'#e65100',font:{size:10},
              callback:function(v){return v+'ms'}},grid:{display:false},
              title:{display:true,text:'Avg ms',color:'#e65100',font:{size:10}}}
        }
      }
    });
  } else {
    document.getElementById('trafficChart').parentElement.innerHTML =
      '<p style="text-align:center;color:#999;padding:2rem;">No traffic data yet</p>';
  }
})();
</script>
{% endif %}
