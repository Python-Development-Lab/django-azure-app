{% if error %}
<div style="background:#fff3cd; border:1px solid #ffc107; border-radius:6px;
            padding:0.75rem; font-size:0.85rem; color:#856404;">⚠ {{ error }}</div>
{% else %}
<div style="position:relative; height:200px;"><canvas id="dailyChart"></canvas></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const dailyTrend = {{ daily_trend_json|safe }};
if (dailyTrend.length > 0) {
  new Chart(document.getElementById('dailyChart'), {
    type: 'line',
    data: {
      labels: dailyTrend.map(d => d.date),
      datasets: [{ label: 'Daily Cost (USD)', data: dailyTrend.map(d => d.cost),
        borderColor:'#0078d4', backgroundColor:'rgba(0,120,212,0.08)',
        borderWidth:2, pointRadius:4, pointBackgroundColor:'#0078d4', fill:true, tension:0.3 }]
    },
    options: { responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false} },
      scales:{
        x:{ticks:{color:'#666',font:{size:11}},grid:{display:false}},
        y:{ticks:{color:'#666',callback:v=>'$'+v.toFixed(2)},grid:{color:'#f0f0f0'},beginAtZero:true}
      }
    }
  });
}
</script>
{% endif %}
