{% if error %}
<div style="background:#fff3cd; border:1px solid #ffc107; border-radius:6px;
            padding:0.75rem; font-size:0.85rem; color:#856404;">⚠ {{ error }}</div>
{% else %}
<div style="display:grid; grid-template-columns:2fr 1fr; gap:1.5rem;">
  <div style="position:relative; height:280px;"><canvas id="barChart"></canvas></div>
  <div style="position:relative; height:280px;"><canvas id="doughnutChart"></canvas></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const costs = {{ costs_json|safe }};
const labels = costs.map(c => c.resource_group.length>20 ? c.resource_group.substring(0,20)+'...' : c.resource_group);
const values = costs.map(c => c.cost);
const colors = ['#0078d4','#2e7d32','#e65100','#6a1b9a','#00838f'];
new Chart(document.getElementById('barChart'), {
  type: 'bar',
  data: { labels, datasets: [{ data: values, backgroundColor: colors, borderRadius: 4 }] },
  options: { responsive: true, maintainAspectRatio: false,
    plugins: { legend: { display: false } },
    scales: {
      x: { ticks: { color:'#666', font:{size:10} }, grid:{display:false} },
      y: { ticks: { color:'#666', callback: v=>'$'+v.toFixed(2) }, grid:{color:'#f0f0f0'} }
    }
  }
});
new Chart(document.getElementById('doughnutChart'), {
  type: 'doughnut',
  data: { labels, datasets: [{ data: values, backgroundColor: colors, borderWidth:2, borderColor:'#fff' }] },
  options: { responsive: true, maintainAspectRatio: false,
    plugins: { legend: { position:'bottom', labels:{color:'#666',font:{size:10},boxWidth:10,padding:6} } }
  }
});
</script>
{% endif %}
