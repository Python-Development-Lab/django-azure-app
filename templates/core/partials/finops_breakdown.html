{% if error %}
<div style="background:#fff3cd; border:1px solid #ffc107; border-radius:6px;
            padding:0.75rem; font-size:0.85rem; color:#856404;">⚠ {{ error }}</div>
{% else %}
<div style="display:grid; grid-template-columns:1fr 1fr; gap:1.5rem;">
  <div style="position:relative; height:220px;"><canvas id="rgBreakdownChart"></canvas></div>
  <table style="width:100%; border-collapse:collapse; font-size:0.82rem;">
    <thead>
      <tr style="background:#f5f5f5;">
        <th style="padding:6px 10px; text-align:left; border-bottom:2px solid #ddd;">Service</th>
        <th style="padding:6px 10px; text-align:left; border-bottom:2px solid #ddd;">Meter</th>
        <th style="padding:6px 10px; text-align:right; border-bottom:2px solid #ddd;">Cost</th>
      </tr>
    </thead>
    <tbody>
      {% for item in rg_breakdown %}
      <tr style="border-bottom:1px solid #eee;">
        <td style="padding:6px 10px; font-weight:500;">{{ item.service }}</td>
        <td style="padding:6px 10px; color:#666; font-size:0.78rem;">{{ item.meter }}</td>
        <td style="padding:6px 10px; text-align:right; font-family:monospace;
                   font-weight:600; color:#e65100;">${{ item.cost }}</td>
      </tr>
      {% empty %}
      <tr><td colspan="3" style="padding:1rem; text-align:center; color:#999;">No data</td></tr>
      {% endfor %}
    </tbody>
    <tfoot>
      <tr style="background:#f5f5f5; font-weight:600;">
        <td colspan="2" style="padding:6px 10px;">Total</td>
        <td style="padding:6px 10px; text-align:right; font-family:monospace;
                   color:#0078d4;">${{ rg_total }}</td>
      </tr>
    </tfoot>
  </table>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const rgBreakdown = {{ rg_breakdown_json|safe }};
if (rgBreakdown.length > 0) {
  new Chart(document.getElementById('rgBreakdownChart'), {
    type: 'bar',
    data: {
      labels: rgBreakdown.map(d => d.meter.length>25 ? d.meter.substring(0,25)+'...' : d.meter),
      datasets: [{ data: rgBreakdown.map(d=>d.cost),
        backgroundColor:['#e24b4a','#2a78d6','#eda100','#1baf7a','#888780'],
        borderRadius:4, borderSkipped:'bottom' }]
    },
    options: { responsive:true, maintainAspectRatio:false,
      plugins:{legend:{display:false}},
      scales:{
        x:{ticks:{color:'#666',font:{size:10}},grid:{display:false}},
        y:{ticks:{color:'#666',callback:v=>'$'+v.toFixed(2)},grid:{color:'#f0f0f0'},beginAtZero:true}
      }
    }
  });
}
</script>
{% endif %}
