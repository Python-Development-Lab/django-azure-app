name: Deploy → Staging (Terraform + DevSecOps)

on:
  push:
    branches: [ develop ]
  workflow_dispatch:
    inputs:
      force_terraform:
        description: 'Force terraform apply even if infra exists'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

env:
  APP_NAME: app-django-azure-staging
  RESOURCE_GROUP: rg-django-azure-staging
  PYTHON_VERSION: "3.12"

jobs:
  # ── Security Scan ─────────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: pip-audit — dependency vulnerabilities
        run: |
          pip install pip-audit --quiet
          pip install -r requirements.txt --quiet
          pip-audit --requirement requirements.txt \
            --format json \
            --output pip-audit-report.json || true
          echo "=== pip-audit summary ==="
          pip-audit --requirement requirements.txt || true

      - name: Trivy — filesystem scan (table)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: Trivy — SARIF output
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            pip-audit-report.json
            trivy-results.sarif
          if-no-files-found: warn

  # ── CI Tests ──────────────────────────────────────────────────────
  test:
    name: Tests & Lint
    runs-on: ubuntu-latest
    needs: security
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt --quiet
          pip install pytest pytest-django coverage flake8 --quiet

      - name: Lint
        run: |
          flake8 . --max-line-length=120 \
            --exclude=venv,migrations,staticfiles,__pycache__,packages

      - name: Run tests
        run: coverage run -m pytest -v && coverage report --fail-under=70
        env:
          SECRET_KEY: "ci-test-key"
          DEBUG: "True"
          ALLOWED_HOSTS: "localhost"
          AZURE_CLIENT_ID: "test"
          AZURE_CLIENT_SECRET: "test"
          AZURE_TENANT_ID: "test"
          AZURE_REDIRECT_URI: "http://localhost/auth/callback/"
          BUILDING: "true"

  # ── Check Infrastructure ──────────────────────────────────────────
  check-infra:
    name: Check Infrastructure
    runs-on: ubuntu-latest
    needs: [security, test]
    outputs:
      infra_exists: ${{ steps.check.outputs.infra_exists }}
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Check if infrastructure exists
        id: check
        run: |
          RG_EXISTS=$(az group exists --name ${{ env.RESOURCE_GROUP }})
          echo "Resource group exists: $RG_EXISTS"

          if [ "$RG_EXISTS" = "true" ]; then
            # Перевіримо чи App Service теж існує
            APP_EXISTS=$(az webapp show \
              --name ${{ env.APP_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --query "name" -o tsv 2>/dev/null || echo "")

            if [ -n "$APP_EXISTS" ]; then
              echo "infra_exists=true" >> $GITHUB_OUTPUT
              echo "Infrastructure is UP — skipping terraform apply"
            else
              echo "infra_exists=false" >> $GITHUB_OUTPUT
              echo "Resource group exists but App Service missing — running terraform"
            fi
          else
            echo "infra_exists=false" >> $GITHUB_OUTPUT
            echo "Infrastructure is DOWN — terraform apply needed"
          fi

      - name: Azure Logout
        if: always()
        run: az logout

  # ── Terraform (only if infra does not exist) ──────────────────────
  terraform:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: check-infra
    if: |
      needs.check-infra.outputs.infra_exists == 'false' ||
      github.event.inputs.force_terraform == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: terraform
        run: |
          terraform plan \
            -var="tenant_id=${{ secrets.AZURE_TENANT_ID }}" \
            -var="db_password=${{ secrets.DB_PASSWORD }}" \
            -var="django_secret_key=${{ secrets.DJANGO_SECRET_KEY }}" \
            -var="azure_client_id=${{ secrets.AZURE_CLIENT_ID }}" \
            -var="azure_client_secret=${{ secrets.AZURE_CLIENT_SECRET }}" \
            -var="azure_redirect_uri=https://${{ env.APP_NAME }}.azurewebsites.net/auth/callback/" \
            -var="terraform_object_id=${{ secrets.TERRAFORM_OBJECT_ID }}" \
            -var="owner_email=${{ secrets.OWNER_EMAIL }}" \
            -out=tfplan

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve tfplan

      - name: Azure Logout
        if: always()
        run: az logout

  # ── Deploy ────────────────────────────────────────────────────────
  deploy:
    name: Deploy + Migrate
    runs-on: ubuntu-latest
    needs: [check-infra, terraform]
    if: always() && needs.check-infra.result == 'success' && (needs.terraform.result == 'success' || needs.terraform.result == 'skipped')
    environment:
      name: staging
      url: https://app-django-azure-staging.azurewebsites.net
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install packages (PYTHONPATH workaround)
        run: pip install -r requirements.txt --target ./packages --quiet

      - name: Collect static files
        run: python manage.py collectstatic --noinput --verbosity 0
        env:
          BUILDING: "true"
          SECRET_KEY: "build-key-ci"
          DEBUG: "False"
          ALLOWED_HOSTS: "localhost"
          AZURE_CLIENT_ID: "build"
          AZURE_CLIENT_SECRET: "build"
          AZURE_TENANT_ID: "build"
          AZURE_REDIRECT_URI: "http://localhost/"

      - name: Create deployment zip
        run: |
          zip -r /tmp/django-app.zip . \
            --exclude ".git/*" \
            --exclude "terraform/*" \
            --exclude "__pycache__/*" \
            --exclude "*.pyc" \
            --exclude ".env*" \
            -q
          echo "Zip size: $(du -sh /tmp/django-app.zip | cut -f1)"

      - name: Deploy to Azure App Service
        run: |
          az webapp deployment source config-zip \
            --name ${{ env.APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --src /tmp/django-app.zip \
            --output none

      - name: Remove local packages
        run: rm -rf packages/

      - name: Wait for app to start
        run: |
          echo "Waiting 90s for app startup..."
          sleep 90
          for i in {1..6}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              https://${{ env.APP_NAME }}.azurewebsites.net/auth/login/ || echo "000")
            echo "  Attempt $i: HTTP $STATUS"
            [ "$STATUS" = "200" ] && echo "App is ready!" && break
            [ "$i" = "6" ] && echo "Warning: app may not be ready" || sleep 15
          done

      - name: Run Django migrations
        run: |
          az webapp ssh \
            --name ${{ env.APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --command "cd /home/site/wwwroot && PYTHONPATH=/home/site/wwwroot/packages python manage.py migrate --noinput"

      - name: Azure Logout
        if: always()
        run: az logout
