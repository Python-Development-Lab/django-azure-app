name: AI PR Review

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]
    paths:
      - "**/*.tf"
      - "security/**"
      - "auth_app/**"
      - "core/**"
      - "djangoapp/**"
      - ".github/workflows/**"

# Не блокує merge — окремий job, не required check (поки не доведе надійність
# на кількох реальних PR). Додати branch protection required-check пізніше.
permissions:
  contents: read
  pull-requests: write

jobs:
  ai-pr-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install anthropic --break-system-packages

      - name: Get PR diff
        id: diff
        run: |
          git diff origin/${{ github.base_ref }}...HEAD -- \
            '*.tf' 'security/**' 'auth_app/**' 'core/**' 'djangoapp/**' \
            > pr.diff
          echo "diff_lines=$(wc -l < pr.diff)" >> "$GITHUB_OUTPUT"

      - name: Skip if diff too large or empty
        id: gate
        run: |
          LINES=${{ steps.diff.outputs.diff_lines }}
          if [ "$LINES" -eq 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "$LINES" -gt 1500 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Diff has $LINES lines — too large for single-pass AI review, skipping. Consider splitting the PR."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run AI review
        if: steps.gate.outputs.skip == 'false'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/ai_pr_review.py --diff pr.diff --out review.md

      - name: Post or update PR comment
        if: steps.gate.outputs.skip == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('review.md', 'utf8');
            const marker = '<!-- ai-pr-review-bot -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            const finalBody = `${marker}\n${body}`;
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: finalBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: finalBody,
              });
            }
